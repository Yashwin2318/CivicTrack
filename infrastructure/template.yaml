AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CivicTrack serverless civic complaint platform with Cognito, DynamoDB, private S3 evidence storage, SES notifications and scheduled SLA escalation

Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Browser origin allowed to call the API and upload evidence. Restrict this to the deployed frontend origin after hosting.
  SesSenderEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Verified Amazon SES sender identity (no default, so no personal address lives in the repository). Pass it with --parameter-overrides on deploy.
  AdminNotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Administrator mailbox for new complaint and SLA notifications. Pass it with --parameter-overrides on deploy.
  EnableFrontendHosting:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create a private S3 bucket and a CloudFront distribution that serve the built frontend over HTTPS (within the CloudFront always-free tier at pilot scale).
  SlaWarningHours:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 24
    Description: Send the first SLA warning this many hours before the 48-hour deadline.

Conditions:
  HostFrontend: !Equals [!Ref EnableFrontendHosting, 'true']

Globals:
  Function:
    Runtime: python3.14
    Timeout: 60
    MemorySize: 512
    Architectures:
      - x86_64

Resources:
  CivicTrackUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: CivicTrack-Users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      LambdaConfig:
        PostConfirmation: !GetAtt CivicTrackPostConfirmationFunction.Arn

  CivicTrackUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: CivicTrack-Web-Client
      UserPoolId: !Ref CivicTrackUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CivicTrackCitizenGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Citizen
      Description: CivicTrack citizens
      UserPoolId: !Ref CivicTrackUserPool

  CivicTrackOfficerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Officer
      Description: CivicTrack complaint handling officers
      UserPoolId: !Ref CivicTrackUserPool

  CivicTrackAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      Description: CivicTrack administrators
      UserPoolId: !Ref CivicTrackUserPool

  CivicTrackApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: CivicTrack-API
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
      Auth:
        DefaultAuthorizer: CivicTrackCognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CivicTrackCognitoAuthorizer:
            UserPoolArn: !GetAtt CivicTrackUserPool.Arn

  ComplaintsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: CivicTrack-Complaints
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: complaintId
          AttributeType: S
        - AttributeName: citizenSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: complaintId
          KeyType: HASH
      # Online, non-destructive addition: every existing item already has both attributes.
      GlobalSecondaryIndexes:
        - IndexName: citizenSub-createdAt-index
          KeySchema:
            - AttributeName: citizenSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  ConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: CivicTrack-Config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ComplaintsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CivicTrack-Lambda-Execution-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CivicTrack-DynamoDB-Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt ComplaintsTable.Arn
                  - !Sub "${ComplaintsTable.Arn}/index/*"
                  - !GetAtt ConfigTable.Arn
        - PolicyName: CivicTrack-Evidence-S3-Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${EvidenceBucket.Arn}/*"
        - PolicyName: CivicTrack-Verify-Officer-Group
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDisableUser
                Resource: !GetAtt CivicTrackUserPool.Arn
        - PolicyName: CivicTrack-SES-Send-Email
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
        - PolicyName: CivicTrack-CloudWatch-Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  ComplaintsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CivicTrack-Complaints
      CodeUri: ../backend/complaints/
      Handler: app.lambda_handler
      Role: !GetAtt ComplaintsExecutionRole.Arn
      Environment:
        Variables:
          COMPLAINTS_TABLE: !Ref ComplaintsTable
          CONFIG_TABLE: !Ref ConfigTable
          CITIZEN_INDEX: citizenSub-createdAt-index
          USER_POOL_ID: !Ref CivicTrackUserPool
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          S3_BUCKET: !Ref EvidenceBucket
          S3_INTERNAL_ENDPOINT_URL: ""
          S3_PRESIGN_ENDPOINT_URL: ""
          S3_ACCESS_KEY_ID: ""
          S3_SECRET_ACCESS_KEY: ""
          UPLOAD_URL_TTL_SECONDS: "300"
          VIEW_URL_TTL_SECONDS: "300"
          SES_FROM_EMAIL: !Ref SesSenderEmail
          ADMIN_NOTIFICATION_EMAIL: !Ref AdminNotificationEmail
          SLA_WARNING_HOURS: !Ref SlaWarningHours
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        CreateEvidenceUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /evidence/upload-url
            Method: POST
        CreateOfficerProofUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/proof-upload-url
            Method: POST
        CreateComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints
            Method: POST
        GetComplaints:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints
            Method: GET
        AssignComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/assign
            Method: PATCH
        StartComplaintWork:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/start
            Method: PATCH
        ResolveComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/resolve
            Method: PATCH

        GetComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}
            Method: GET
        UpdateComplaintDetails:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}
            Method: PATCH
        UnassignComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/unassign
            Method: PATCH
        ReopenComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/reopen
            Method: PATCH
        CloseComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/close
            Method: PATCH
        ListOfficers:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /officers
            Method: GET
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /me
            Method: GET
        GetReference:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /reference
            Method: GET
        GetNotifications:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /notifications
            Method: GET
        GetAnalytics:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /analytics
            Method: GET
        CheckSimilar:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/similar
            Method: POST
        AcceptAssignment:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/accept
            Method: PATCH
        DeclineAssignment:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/decline
            Method: PATCH
        ProgressUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/progress
            Method: PATCH
        RejectComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/reject
            Method: PATCH
        EscalateComplaint:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /complaints/{complaintId}/escalate
            Method: PATCH
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/users
            Method: GET
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/users
            Method: POST
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/users/{username}
            Method: PATCH
        UpdateOfficerProfile:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/officers/{officerSub}/profile
            Method: PUT
        InitializeReference:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/reference/initialize
            Method: POST
        PutDepartment:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/departments/{departmentId}
            Method: PUT
        PutCategory:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/categories/{category}
            Method: PUT
        PutZone:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/zones/{zoneId}
            Method: PUT
        PutWard:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/wards/{wardId}
            Method: PUT
        ImportBoundaries:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/boundaries/import
            Method: POST
        PutSettings:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/settings
            Method: PUT
        GetAuditLog:
          Type: Api
          Properties:
            RestApiId: !Ref CivicTrackApi
            Path: /admin/audit
            Method: GET

  SlaScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: CivicTrack-SLA-Checker
      Description: Check unresolved CivicTrack complaints for approaching and breached 48-hour SLAs.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ComplaintsFunction.Arn
          Id: CivicTrackSlaCheckerTarget

  SlaScheduleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ComplaintsFunction.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SlaScheduleRule.Arn

  CivicTrackPostConfirmationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CivicTrack-PostConfirmation-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AddConfirmedCitizensToCitizenGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminAddUserToGroup
                Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  CivicTrackPostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CivicTrack-PostConfirmation
      CodeUri: ../backend/post_confirmation/
      Handler: app.lambda_handler
      Role: !GetAtt CivicTrackPostConfirmationRole.Arn
      Timeout: 10
      MemorySize: 128

  CivicTrackPostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CivicTrackPostConfirmationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CivicTrackUserPool.Arn

  # ---- Optional static hosting for the built frontend (EnableFrontendHosting=true) ----
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: HostFrontend
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "civictrack-frontend-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HostFrontend
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "civictrack-frontend-oac-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HostFrontend
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CivicTrack web frontend
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HostFrontend
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  FrontendUrl:
    Condition: HostFrontend
    Description: HTTPS address of the hosted frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Condition: HostFrontend
    Description: Bucket that holds the built frontend (upload frontend/dist here)
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Condition: HostFrontend
    Description: CloudFront distribution to invalidate after each upload
    Value: !Ref FrontendDistribution
  ApiUrl:
    Description: CivicTrack API endpoint
    Value: !Sub "https://${CivicTrackApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CivicTrackUserPool
  UserPoolClientId:
    Description: Cognito Web Client ID
    Value: !Ref CivicTrackUserPoolClient
  EvidenceBucketName:
    Description: Private S3 bucket for complaint evidence and resolution photos
    Value: !Ref EvidenceBucket
  AllowedFrontendOrigin:
    Description: Currently allowed browser origin
    Value: !Ref AllowedOrigin
  ConfigTableName:
    Description: Reference data, officer profiles, settings and audit log
    Value: !Ref ConfigTable
  SesSenderEmail:
    Description: SES sender address configured for CivicTrack notifications
    Value: !Ref SesSenderEmail

